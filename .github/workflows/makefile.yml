name: Terraform CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  hamer_cloud-plan:
    runs-on: ubuntu-latest
    needs: lint
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        working-directory: websites
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"
      - name: Configure AWS Profile
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << 'CREDS'
          [hamer]
          aws_access_key_id = placeholder
          aws_secret_access_key = placeholder
          CREDS
          cat > ~/.aws/config << 'CONF'
          [profile hamer]
          region = us-east-1
          CONF
          sed -i "s|aws_access_key_id = placeholder|aws_access_key_id = ${AWS_ACCESS_KEY_ID}|" ~/.aws/credentials
          sed -i "s|aws_secret_access_key = placeholder|aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}|" ~/.aws/credentials
      - name: Terraform Init
        run: terraform init
      - name: Select Workspace
        run: terraform workspace select hamer || terraform workspace new hamer
      - name: Terraform Plan
        run: terraform plan -no-color

  # Needs the bootstrap apply: the roles here reference hamercloud-boundary.
  # The bootstrap apply only runs on push to master, so this no longer runs
  # for pull requests either.
  hamer_cloud-apply:
    runs-on: ubuntu-latest
    needs: [hamer_cloud-plan, hamercloud_bootstrap-apply]
    environment: hamercloud
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        working-directory: websites
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"
      - name: Configure AWS Profile
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << 'CREDS'
          [hamer]
          aws_access_key_id = placeholder
          aws_secret_access_key = placeholder
          CREDS
          cat > ~/.aws/config << 'CONF'
          [profile hamer]
          region = us-east-1
          CONF
          sed -i "s|aws_access_key_id = placeholder|aws_access_key_id = ${AWS_ACCESS_KEY_ID}|" ~/.aws/credentials
          sed -i "s|aws_secret_access_key = placeholder|aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}|" ~/.aws/credentials
      - name: Terraform Init
        run: terraform init
      - name: Select Workspace
        run: terraform workspace select hamer || terraform workspace new hamer
      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color

  # One-time CI roles for THOM-AwS/hamercloud. Moves to hamercloud
  # infra/bootstrap (same state key) once that repo plans through them.
  hamercloud_bootstrap-plan:
    runs-on: ubuntu-latest
    needs: lint
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        working-directory: hamercloud_bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"
      - name: Terraform Init
        run: terraform init -input=false
      - name: Terraform Validate
        run: terraform validate -no-color
      - name: Terraform Plan
        run: terraform plan -input=false -no-color -lock=false

  hamercloud_bootstrap-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: hamercloud_bootstrap-plan
    environment: hamercloud
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        working-directory: hamercloud_bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"
      - name: Terraform Init
        run: terraform init -input=false
      - name: Terraform Apply
        run: terraform apply -input=false -no-color -auto-approve

  ThomasHamerVPC-plan:
    runs-on: ubuntu-latest
    needs: lint
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        working-directory: vpc
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"
      - name: Configure AWS Profile
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << 'CREDS'
          [hamer]
          aws_access_key_id = placeholder
          aws_secret_access_key = placeholder
          CREDS
          cat > ~/.aws/config << 'CONF'
          [profile hamer]
          region = us-east-1
          CONF
          sed -i "s|aws_access_key_id = placeholder|aws_access_key_id = ${AWS_ACCESS_KEY_ID}|" ~/.aws/credentials
          sed -i "s|aws_secret_access_key = placeholder|aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}|" ~/.aws/credentials
      - name: Terraform Init
        run: terraform init
      - name: Select Workspace
        run: terraform workspace select prod || terraform workspace new prod
      - name: Terraform Plan
        run: terraform plan -no-color

  ThomasHamerVPC-apply:
    runs-on: ubuntu-latest
    needs: ThomasHamerVPC-plan
    environment: thomashamer_vpc
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        working-directory: vpc
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"
      - name: Configure AWS Profile
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << 'CREDS'
          [hamer]
          aws_access_key_id = placeholder
          aws_secret_access_key = placeholder
          CREDS
          cat > ~/.aws/config << 'CONF'
          [profile hamer]
          region = us-east-1
          CONF
          sed -i "s|aws_access_key_id = placeholder|aws_access_key_id = ${AWS_ACCESS_KEY_ID}|" ~/.aws/credentials
          sed -i "s|aws_secret_access_key = placeholder|aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}|" ~/.aws/credentials
      - name: Terraform Init
        run: terraform init
      - name: Select Workspace
        run: terraform workspace select prod || terraform workspace new prod
      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color
